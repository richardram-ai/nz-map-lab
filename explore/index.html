<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore in 3D · NZ Map Lab</title>
<meta name="description" content="The test area in Google's photorealistic 3D, with the group's records, Street View and place search.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#303A2E;--muted:#5f6b5a;--rule:#B8C5B0;--card:#FCFDFB;--sage:#E1E8DC;--accent:#56664D;--warn:#a8661a;
  --font:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--mono:"Atkinson Hyperlegible Mono",ui-monospace,Consolas,"Liberation Mono",monospace}
html,body{margin:0;height:100%;background:#E1E8DC;font-family:var(--font);color:var(--ink)}
#globe{position:absolute;inset:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(48,58,46,.18)}
#panel{position:absolute;left:12px;top:12px;width:300px;max-width:calc(100% - 24px);padding:12px 14px;z-index:2;box-sizing:border-box}
#panel h1{font-size:1.05rem;margin:0 0 2px}
#panel p{margin:0 0 8px;font-size:.8rem;color:var(--muted);line-height:1.4}
#panel label{display:flex;gap:6px;align-items:center;font-size:.85rem;margin:4px 0}
#panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.8rem}
#panel .row a{color:var(--accent)}
#search{margin:6px 0 8px}
#panel .dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#zoom{position:absolute;right:12px;bottom:44px;z-index:2;display:flex;flex-direction:column;overflow:hidden}
#zoom button{font:inherit;font-size:1.2rem;width:36px;height:36px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
#zoom button+button{border-top:1px solid var(--rule)} #zoom button:hover{background:var(--sage)}
#search gmp-place-autocomplete{width:100%}
#rec{position:absolute;right:12px;top:12px;width:290px;max-width:calc(100% - 24px);padding:10px 12px;z-index:2;box-sizing:border-box;font-size:.84rem;display:none}
#rec .src{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
#rec b.t{display:block;font-size:.95rem;margin:2px 0 4px}
#rec dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:4px 0} #rec dt{color:var(--muted)} #rec dd{margin:0}
#rec .pp{display:flex;gap:4px;margin:6px 0} #rec .pp img{width:76px;height:76px;object-fit:cover;border-radius:4px}
#rec .mm{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}
#rec .x,#sv .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:1.2rem;cursor:pointer;color:var(--muted)}
.btn{font:inherit;font-size:.8rem;border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:999px;padding:4px 10px;cursor:pointer}
.btn:hover{background:var(--sage)}
.glinks{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;padding-top:6px;border-top:1px solid var(--sage);font-size:.74rem}
.glinks a{color:var(--muted);text-decoration:none;white-space:nowrap} .glinks a::after{content:' ↗';font-size:.9em}
#sv{position:absolute;right:12px;bottom:40px;width:min(480px,calc(100% - 24px));height:min(320px,45vh);z-index:3;display:none;overflow:hidden}
#sv .pano{position:absolute;inset:0}
#sv .x{z-index:2;background:rgba(252,253,251,.9);border-radius:4px;padding:0 6px}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 18px;max-width:340px;z-index:4;display:none;font-size:.9rem;line-height:1.45}
.cesium-viewer-bottom{z-index:1}
@media (max-width:640px){
  #panel{top:auto;bottom:34px;left:8px;right:8px;width:auto;max-width:none}
  #panel p.long{display:none}
  #rec{top:8px;right:8px;left:8px;width:auto;max-width:none}
  #sv{right:8px;left:8px;width:auto;bottom:auto;top:8px;height:40vh}
}
</style></head>
<body>
<div id="globe"></div>

<div id="panel" class="card">
  <h1>Explore in 3D</h1>
  <p class="long">Google's photorealistic 3D view of the area, with the group's records as pins. Drag to move, Ctrl-drag to tilt and turn, scroll, pinch or use + − to zoom. Tap a pin for its card and Street View.</p>
  <div id="search"></div>
  <label><input type="checkbox" id="t-rec" checked> Our records</label>
  <label><input type="checkbox" id="t-trees" checked> <span class="dot" style="background:#c47d14"></span>Huts (DOC)</label>
  <label><input type="checkbox" id="t-notable" checked> <span class="dot" style="background:#b8334a;width:12px;height:12px"></span>Conifer sightings (iNaturalist)</label>
  <label><input type="checkbox" id="t-inat"> <span class="dot" style="background:#28699a"></span>Species sightings (iNaturalist)</label>
  <label><input type="checkbox" id="t-area" checked> Kashmir Road block</label>
  <div class="row"><button class="btn" id="home" type="button">Back to the area</button><a href="/">2D map</a><a href="/add/">Add a record</a></div>
</div>

<div id="rec" class="card" role="dialog" aria-label="Record"><button class="x" type="button" aria-label="Close">×</button><div class="body"></div></div>
<div id="sv" class="card" aria-label="Street View"><button class="x" type="button" aria-label="Close Street View">×</button><div class="pano"></div></div>
<div id="zoom" class="card"><button type="button" id="z-in" aria-label="Zoom in">+</button><button type="button" id="z-out" aria-label="Zoom out">−</button></div>
<div id="msg" class="card"></div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const say = html => { $('msg').innerHTML = html; $('msg').style.display = 'block'; };

  // Settings and key
  const cfg = await fetch('/config/site.json').then(r => r.json()).catch(() => ({}));
  const area = cfg.area || {}; const centre = area.centre || [175.6195, -40.3498];
  const cats = Object.fromEntries((cfg.categories || []).map(c => [c.id, c.colour]));
  const tasks = Object.fromEntries((cfg.tasks || []).map(t => [t.id, t]));
  const kr = await fetch('/api/gkey').then(r => r.json()).catch(() => ({}));
  if (!kr.key) { say('<b>Google Maps isn’t set up yet.</b><br>Add the key as the Cloudflare variable <code>GOOGLE_MAPS_KEY</code>. The <a href="/">2D map</a> works without it.'); return; }
  const KEY = kr.key;

  // 3D globe with Google Photorealistic 3D Tiles (Map Tiles API). Google's logo and data credits show bottom left.
  Cesium.GoogleMaps.defaultApiKey = KEY;
  const viewer = new Cesium.Viewer('globe', {
    globe:false, baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false, navigationHelpButton:false,
    timeline:false, animation:false, fullscreenButton:false, infoBox:false, selectionIndicator:false, requestRenderMode:true
  });
  viewer.scene.skyAtmosphere.show = true; window.__viewer = viewer;
  try {
    const tiles = await Cesium.createGooglePhotorealistic3DTileset();
    viewer.scene.primitives.add(tiles);
  } catch (e) {
    say('<b>The 3D view couldn’t load.</b><br>Check that the Map Tiles API is turned on for the key. (' + esc(e.message) + ')'); return;
  }
  // Points are placed at heights sampled from the 3D tiles: with no globe, CLAMP_TO_GROUND leaves them at sea level,
  // which in hill country (Ruahine is 400–1,700 m) puts them well away from where they belong. area.ground_m is the first guess.
  const GROUND = Number(area.ground_m) || 50;
  const settleQ = []; let settleT = null;
  function settle(ents) {
    settleQ.push(...ents); clearTimeout(settleT);
    settleT = setTimeout(async () => {
      const list = settleQ.splice(0); if (!list.length) return;
      const now = viewer.clock.currentTime;
      const cs = list.map(e => Cesium.Cartographic.fromCartesian(e.position.getValue(now)));
      try {
        const hs = await viewer.scene.sampleHeightMostDetailed(cs.map(c => c.clone()), list);
        hs.forEach((c, i) => { if (c && Number.isFinite(c.height)) list[i].position = Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, c.height + 3); });
        viewer.scene.requestRender();
      } catch (e) { console.warn('Point heights:', e && e.message); }
    }, 4000);
  }
  const home = (instant) => {
    const target = new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(centre[0], centre[1], GROUND), 10);
    // Far enough back to see the whole focus area (about 1.4 km for a 1 km square)
    const sqr = Array.isArray(area.square) && area.square.length === 2 ? area.square : null;
    const span = sqr ? Math.max((sqr[1][0] - sqr[0][0]) * 111320 * Math.cos(centre[1] * Math.PI / 180), (sqr[1][1] - sqr[0][1]) * 110540) : 1000;
    const offset = new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-40), Math.max(1450, span * 1.4));
    viewer.camera.flyToBoundingSphere(target, { offset, duration: instant ? 0 : 1.6 });
  };
  home(true);
  $('home').onclick = () => home(false);

  // The test area outline: heights sampled from the 3D tiles so the line sits on the ground, and shows faintly through buildings
  const areaEnt = [];
  let sq = Array.isArray(area.square) ? area.square : [];
  if (sq.length === 2) { const [[w, so], [e, n]] = sq; sq = [[w, so], [e, so], [e, n], [w, n]]; }  // two corners -> rectangle
  if (sq.length > 2) {
    const ring = [...sq, sq[0]], pts = [];
    for (let k = 0; k < ring.length - 1; k++) for (let t = 0; t < 30; t++) {
      const a = ring[k], b = ring[k + 1]; pts.push(Cesium.Cartographic.fromDegrees(a[0] + (b[0] - a[0]) * t / 30, a[1] + (b[1] - a[1]) * t / 30)); }
    pts.push(Cesium.Cartographic.fromDegrees(ring[0][0], ring[0][1]));
    const col = Cesium.Color.fromCssColorString('#F2C14E');
    // Drawn first at an estimated ground height (area.ground_m), then refined from the 3D surface
    const line = viewer.entities.add({ polyline: { positions: pts.map(c => Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, GROUND + 2)), width: 4, material: col, depthFailMaterial: col.withAlpha(.45) } });
    areaEnt.push(line);
    setTimeout(() => viewer.scene.sampleHeightMostDetailed(pts.map(c => c.clone()), [line]).then(hs => {
      const known = hs.filter(c => c && Number.isFinite(c.height)).map(c => c.height); if (!known.length) return;
      const fallback = Math.min(...known);
      line.polyline.positions = hs.map(c => Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, (Number.isFinite(c.height) ? c.height : fallback) + 2));
      viewer.scene.requestRender();
    }).catch(e => console.warn('Outline heights:', e && e.message)), 4000);
  }
  $('t-area').onchange = e => { areaEnt.forEach(x => x.show = e.target.checked); viewer.scene.requestRender(); };

  // The group's records
  const recEnt = []; let fc = { features: [] };
  try { fc = await fetch('/api/annotations').then(r => r.ok ? r.json() : { features: [] }); } catch {}
  for (const f of fc.features || []) {
    const p = f.properties || {}, g = f.geometry || {}; if (!g.coordinates) continue;
    const col = Cesium.Color.fromCssColorString(cats[p.cat] || '#b8334a');
    let ent;
    if (g.type === 'Point') {
      ent = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(g.coordinates[0], g.coordinates[1], GROUND),
        point: { pixelSize: 13, color: col, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
          disableDepthTestDistance: Number.POSITIVE_INFINITY } });
    } else {
      const coords = g.type === 'Polygon' ? [...g.coordinates[0]] : g.coordinates;
      ent = viewer.entities.add({ polyline: { positions: Cesium.Cartesian3.fromDegreesArray(coords.flat()), width: 4, clampToGround: true, material: col } });
    }
    ent._rec = f; recEnt.push(ent);
  }
  settle(recEnt.filter(e => e.point));
  $('t-rec').onchange = e => { recEnt.forEach(x => x.show = e.target.checked); viewer.scene.requestRender(); };

  // Record card
  const gLinks = ll => { const q = (+ll[1]).toFixed(6) + ',' + (+ll[0]).toFixed(6);
    return `<span class="glinks"><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a><a href="https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=walking" target="_blank" rel="noopener">Directions</a></span>`; };
  const anchor = g => g.type === 'Point' ? g.coordinates : g.type === 'LineString' ? g.coordinates[0] : g.coordinates[0][0];
  function showRec(f) {
    const p = f.properties || {}, m = p.meta || {}, t = tasks[m.task], photos = Array.isArray(p.photos) ? p.photos : [];
    let h = `<span class="src">${esc(t ? t.label : p.cat)}</span><b class="t">${esc(p.title)}</b>`;
    if (t && m.fields) {
      const rows = t.fields.filter(fd => m.fields[fd.id] !== undefined && fd.id !== 'title').map(fd => {
        let v = m.fields[fd.id]; if (v && typeof v === 'object') v = v.label + (v.sci ? ` (${v.sci})` : ''); if (v === true) v = 'Yes'; if (v === false) v = 'No';
        return `<dt>${esc(fd.label)}</dt><dd>${esc(v)}</dd>`; }).join('');
      if (rows) h += `<dl>${rows}</dl>`;
    }
    if (p.note) h += esc(p.note) + '<br>';
    if (photos.length) h += `<span class="pp">${photos.map(ph => `<a href="${esc(ph.url)}" target="_blank" rel="noopener"><img src="${esc(ph.url)}" alt="${esc(ph.caption || p.title)}"></a>`).join('')}</span>`;
    const when = p.added ? new Date(p.added).toLocaleDateString('en-NZ', { day:'numeric', month:'short', year:'numeric' }) : '';
    h += `<span class="mm">${[p.by ? 'By ' + esc(p.by) : '', when].filter(Boolean).join(' · ')}</span>`;
    const ll = anchor(f.geometry);
    h += `<div style="margin-top:8px"><button class="btn" type="button" id="sv-go">Street View here</button></div>` + gLinks(ll);
    $('rec').querySelector('.body').innerHTML = h; $('rec').style.display = 'block';
    $('sv-go').onclick = () => openStreetView(ll);
  }
  $('rec').querySelector('.x').onclick = () => { $('rec').style.display = 'none'; };

  // Public layers from the 2D map: DOC huts, iNaturalist conifer sightings, iNaturalist sightings in the focus block
  const INATC = { Aves:'#28699a', Plantae:'#2c7a4b', Insecta:'#c47d14', Fungi:'#8a5a3c', Arachnida:'#6a4c9c', Reptilia:'#b8334a' };
  const layerDefs = [
    { id:'trees', file:'doc_huts', size:10, colour:() => '#c47d14' },
    { id:'notable', file:'inat_conifers', size:10, colour:() => '#b8334a' },
    { id:'inat', file:'inat_obs', size:8, colour:p => INATC[p.group] || '#7d8883' },
  ];
  const layerEnts = {};
  for (const L of layerDefs) {
    layerEnts[L.id] = [];
    fetch('/data/' + L.file + '.geojson').then(r => r.json()).then(fc => {
      for (const f of fc.features || []) {
        if (!f.geometry || f.geometry.type !== 'Point') continue;
        const ent = viewer.entities.add({ show: $('t-' + L.id).checked, position: Cesium.Cartesian3.fromDegrees(f.geometry.coordinates[0], f.geometry.coordinates[1], GROUND),
          point: { pixelSize: L.size, color: Cesium.Color.fromCssColorString(L.colour(f.properties || {})), outlineColor: Cesium.Color.WHITE, outlineWidth: 1.5,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            scaleByDistance: new Cesium.NearFarScalar(300, 1.3, 4000, 0.6) } });
        ent._layer = L.id; ent._f = f; layerEnts[L.id].push(ent);
      }
      settle(layerEnts[L.id]); viewer.scene.requestRender();
    }).catch(() => {});
    $('t-' + L.id).onchange = e => { layerEnts[L.id].forEach(x => x.show = e.target.checked); viewer.scene.requestRender(); };
  }
  function showFeature(ent) {
    const p = ent._f.properties || {}, ll = ent._f.geometry.coordinates; let h = '';
    if (ent._layer === 'inat') h = `<span class="src">Species sighting · iNaturalist</span><b class="t">${esc(p.name)}</b><i>${esc(p.sci)}</i><br>${esc(p.date)} · ${p.grade === 'research' ? 'Research grade' : p.grade === 'needs_id' ? 'Needs ID' : 'Casual'}${p.obscured ? '<br>Location blurred' : ''}<br><a href="${esc(p.url)}" target="_blank" rel="noopener">Open on iNaturalist</a>`;
    else if (ent._layer === 'notable') h = `<span class="src">Conifer sighting · iNaturalist</span><b class="t">${esc(p.name)}</b><i>${esc(p.sci)}</i><br>${esc(p.date)}<br><a href="${esc(p.url)}" target="_blank" rel="noopener">Open on iNaturalist</a>`;
    else h = `<span class="src">Hut · Department of Conservation</span><b class="t">${esc(String(p.name || 'Hut').replace(/\s*\(H\)\s*$/, ''))}</b>${esc(p.kind || '')}`;
    h += `<div style="margin-top:8px"><button class="btn" type="button" id="sv-go">Street View here</button></div>` + gLinks(ll);
    $('rec').querySelector('.body').innerHTML = h; $('rec').style.display = 'block';
    $('sv-go').onclick = () => openStreetView(ll);
  }

  const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction(ev => {
    const picked = viewer.scene.pick(ev.position);
    const ent = picked && picked.id; if (!ent) return;
    if (ent._rec) showRec(ent._rec); else if (ent._f) showFeature(ent);
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // Zoom: + and − buttons, and a laptop trackpad pinch (which the browser sends as Ctrl + scroll)
  const ctl = viewer.scene.screenSpaceCameraController;
  ctl.zoomEventTypes = [Cesium.CameraEventType.WHEEL, Cesium.CameraEventType.PINCH, Cesium.CameraEventType.RIGHT_DRAG,
    { eventType: Cesium.CameraEventType.WHEEL, modifier: Cesium.KeyboardEventModifier.CTRL }];
  ctl.tiltEventTypes = [Cesium.CameraEventType.MIDDLE_DRAG, Cesium.CameraEventType.PINCH,
    { eventType: Cesium.CameraEventType.LEFT_DRAG, modifier: Cesium.KeyboardEventModifier.CTRL },
    { eventType: Cesium.CameraEventType.RIGHT_DRAG, modifier: Cesium.KeyboardEventModifier.CTRL }];
  viewer.scene.canvas.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });  // stop the page zooming instead
  const zoomBy = f => { const h = viewer.camera.positionCartographic.height; viewer.camera.zoomIn(Math.max(20, h * f)); viewer.scene.requestRender(); };
  $('z-in').onclick = () => zoomBy(0.4);
  $('z-out').onclick = () => { const h = viewer.camera.positionCartographic.height; viewer.camera.zoomOut(Math.max(40, h * 0.6)); viewer.scene.requestRender(); };

  // Google Maps JavaScript API: Street View and place search (loaded once, on this page only)
  const gm = new Promise((ok, fail) => {
    window.__gmReady = ok;
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(KEY)}&v=weekly&loading=async&callback=__gmReady&region=NZ&language=en`;
    s.onerror = () => fail(new Error('Google Maps could not load')); document.head.appendChild(s);
  });

  let pano = null;
  async function openStreetView(ll) {
    await gm; const { StreetViewPanorama, StreetViewService } = await google.maps.importLibrary('streetView');
    const svc = new StreetViewService();
    try {
      const { data } = await svc.getPanorama({ location: { lat: ll[1], lng: ll[0] }, radius: 60, source: google.maps.StreetViewSource.OUTDOOR });
      $('sv').style.display = 'block';
      const pos = data.location.latLng;
      if (!pano) pano = new StreetViewPanorama($('sv').querySelector('.pano'), { addressControl:false, fullscreenControl:true, motionTracking:false });
      pano.setPano(data.location.pano);
      // Face the record from where the panorama was taken
      const dLat = ll[1] - pos.lat(), dLng = (ll[0] - pos.lng()) * Math.cos(ll[1] * Math.PI / 180);
      pano.setPov({ heading: (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360, pitch: 0 });
      pano.setVisible(true);
    } catch {
      $('sv').style.display = 'none';
      alertBox('No Street View within 60 m of this spot.');
    }
  }
  $('sv').querySelector('.x').onclick = () => { $('sv').style.display = 'none'; };
  function alertBox(t) { const d = document.createElement('span'); d.className = 'mm'; d.style.color = 'var(--warn)'; d.textContent = t; $('rec').querySelector('.body').appendChild(d); }

  // Place search (Places API, New). Results move the 3D view; nothing is stored.
  (async () => {
    try {
      await gm; const { PlaceAutocompleteElement } = await google.maps.importLibrary('places');
      const ac = new PlaceAutocompleteElement({ includedRegionCodes: ['nz'], locationBias: { center: { lat: centre[1], lng: centre[0] }, radius: 20000 } });
      ac.setAttribute('placeholder', 'Search for a place');
      $('search').appendChild(ac);
      const go = async place => {
        await place.fetchFields({ fields: ['displayName', 'location', 'viewport'] });
        const L = place.location; if (!L) return;
        // Range from the place's size: a park or suburb gets a wider view than a single building
        let range = 700; const vp = place.viewport;
        if (vp) { const ne = vp.getNorthEast(), sw = vp.getSouthWest(); const span = Math.max((ne.lat() - sw.lat()) * 111000, (ne.lng() - sw.lng()) * 85000); range = Math.min(6000, Math.max(450, span * 1.6)); }
        const h = await viewer.scene.sampleHeightMostDetailed([Cesium.Cartographic.fromDegrees(L.lng(), L.lat())]).then(r => Number.isFinite(r[0].height) ? r[0].height : 50).catch(() => 50);
        viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(L.lng(), L.lat(), h), 10),
          { offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-38), range), duration: 2 });
      };
      ac.addEventListener('gmp-select', ev => ev.placePrediction && go(ev.placePrediction.toPlace()));
      ac.addEventListener('gmp-placeselect', ev => ev.place && go(ev.place));
    } catch { $('search').innerHTML = '<p>Place search isn’t available (check the Places API is turned on).</p>'; }
  })();
})();
</script>
</body></html>
